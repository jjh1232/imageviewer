<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  og.png 의 원본. 배포되는 파일이 아니라 그림을 만드는 틀이다 (public/ 밖이라 공개되지 않는다).
  다시 만들기: npm run og  → public/og.png (1200×630). 한 장을 세 언어가 같이 쓴다.
  색은 토스풍(헌법 §12)
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f2f4f6; color: #191f28;
    font: 15px/1.6 "Malgun Gothic", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 84px;
  }
  .text { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .brand { font-size: 22px; letter-spacing: .1em; color: #5f6b7a; }
  h1 { font-size: 60px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; }
  .sub { font-size: 25px; color: #4e5968; }
  .badges { display: flex; gap: 10px; flex-wrap: wrap; }
  .badges span { font-size: 20px; font-weight: 600; color: #1b64da; background: #e8f3ff; border-radius: 999px; padding: 7px 20px; }
  /* 두 장 펼침 그림 — 사진 대신 면으로 */
  .spread { display: flex; gap: 0; background: #fff; border-radius: 20px; padding: 22px; box-shadow: 0 12px 32px rgba(0,23,51,.12); }
  .page { width: 150px; height: 220px; background: #e9ecef; display: flex; flex-direction: column; gap: 10px; padding: 16px; }
  .page:first-child { border-radius: 8px 0 0 8px; }
  .page:last-child { border-radius: 0 8px 8px 0; background: #e5e8eb; }
  .page i { display: block; height: 60px; background: #d1d6db; border-radius: 6px; }
  .page b { display: block; height: 10px; background: #d1d6db; border-radius: 5px; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">prelaps · imageviewer</div>
    <h1>만화·웹툰<br>이미지 뷰어</h1>
    <p class="sub">Comic &amp; webtoon viewer · 漫画ビューア</p>
    <div class="badges">
      <span>한 장 · 두 장 펼침 · 세로로</span>
      <span>번호 주소 한 번에</span>
      <span>무료</span>
    </div>
  </div>
  <div class="spread">
    <div class="page"><i></i><b></b><b></b><i></i></div>
    <div class="page"><i></i><b></b><i></i><b></b></div>
  </div>
</body>
</html>
